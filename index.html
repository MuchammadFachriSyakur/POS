<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BengkelPOS</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf0;--sf:#fff;--tx:#14202b;--mu:#5d6b78;--bd:#d3dbe1;--ac:#0f6b6b;--act:#fff;--am:#f2a900;--nv:#14202b;--ok:#15803d;--wn:#b45309;--er:#b91c1c;--hl:#eef6f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0e161d;--sf:#17222b;--tx:#e6ecf0;--mu:#93a2ae;--bd:#2a3844;--ac:#35b3b3;--act:#06201f;--nv:#0a1015;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--hl:#14303a}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e161d;--sf:#17222b;--tx:#e6ecf0;--mu:#93a2ae;--bd:#2a3844;--ac:#35b3b3;--act:#06201f;--nv:#0a1015;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--hl:#14303a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--nv);color:#dfe7ec;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font:700 24px 'Barlow Condensed',sans-serif;color:#fff;padding:0 10px 14px;letter-spacing:.5px}.logo b{color:var(--am)}
aside button.n{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;display:block;color:#b8c5ce}
aside button.n:hover{background:#ffffff14}aside button.n.on{background:var(--am);color:#1a1300;font-weight:600}
aside label{font-size:12px;color:#8fa0ab;margin:auto 10px 2px}aside select{margin:0 10px;background:#ffffff14;color:#fff;border:1px solid #ffffff30;border-radius:6px;padding:6px}
main{padding:24px 28px;min-width:0}h1{font:700 30px 'Barlow Condensed',sans-serif;margin:0 0 4px}h2{font:600 18px Barlow;margin:0 0 10px}.sub{color:var(--mu);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.sp{flex:1}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--am);border-radius:6px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.stat b{display:block;font:700 30px 'Barlow Condensed'}.stat span{color:var(--mu);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-weight:600;color:var(--mu);font-size:13px}tr.k{cursor:pointer}tr.k:hover td{background:var(--hl)}td.r,th.r{text-align:right}
input,select,textarea{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;max-width:100%}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:6px;padding:8px 14px;cursor:pointer}.btn.p{background:var(--ac);color:var(--act);border-color:var(--ac)}.btn.w{background:var(--am);color:#1a1300;border-color:var(--am)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.s{padding:4px 9px;font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid currentColor}.t0{color:var(--mu)}.t1{color:var(--ac)}.t2{color:var(--wn)}.t3{color:var(--ok)}.t4{color:var(--er)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mu)}.f input,.f select,.f textarea{font-size:15px;color:var(--tx)}
.dirty{color:var(--wn);font-weight:600}.saved{color:var(--ok);font-weight:600}.man{font-size:11.5px;background:var(--am);color:#1a1300;border-radius:4px;padding:1px 6px;margin-left:6px}
.sum{display:flex;justify-content:flex-end;gap:24px;padding-top:12px;font-size:17px}.sum b{font:700 24px 'Barlow Condensed'}
.pick{position:relative;flex:1;min-width:220px}.dd{position:absolute;left:0;right:0;top:100%;background:var(--sf);border:1px solid var(--bd);border-radius:6px;z-index:5;max-height:240px;overflow:auto;box-shadow:0 8px 20px #0003}.dd div{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.dd div:hover{background:var(--hl)}
#md{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}#md.on{display:flex}#md>div{background:var(--sf);border-radius:10px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
#ts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--nv);color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:30}
.rad{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--bd);border-radius:6px;margin:6px 0;cursor:pointer;color:var(--tx);font-size:14px}
.flow{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 14px}.flow span{padding:3px 10px;font-size:12.5px;border-radius:4px;background:var(--bg);color:var(--mu)}.flow .cur{background:var(--ac);color:var(--act);font-weight:600}
.login{max-width:380px;margin:8vh auto}.chip{font:inherit;font-size:13px;border:1px dashed var(--bd);background:none;color:var(--tx);border-radius:6px;padding:5px 9px;margin:3px 3px 0 0;cursor:pointer}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}aside label{display:none}aside select{margin:0}main{padding:16px}.grid2{grid-template-columns:1fr}}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:99px;background:var(--bd);position:relative;cursor:pointer;padding:0;border:0;flex:none}.sw::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}.sw:checked{background:var(--ac)}.sw:checked::after{left:20px}.sw:disabled{opacity:.5}
#pr,#tb,#sc{display:none}#pr{background:#fff;color:#000;padding:20px}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}body{background:#fff}}
@media(max-width:900px){#tb{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:12;background:var(--nv);color:#fff;padding:8px 12px;font:700 20px 'Barlow Condensed',sans-serif}body.lo #tb{display:none}#tb button{all:unset;cursor:pointer;font-size:24px;padding:2px 8px}.app{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;bottom:0;width:250px;height:100%;transform:translateX(-102%);transition:transform .2s;z-index:15;flex-direction:column;flex-wrap:nowrap;overflow:auto}.app.open aside{transform:none}aside label{display:block}.app.open #sc{display:block;position:fixed;inset:0;background:#0007;z-index:14}main{padding:16px}}
@media(max-width:640px){input,select,textarea{font-size:16px}.tw{overflow:visible}table.rt,table.rt tbody{display:block}table.rt tr.hd{display:none}table.rt tr{display:block;border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;padding:6px 10px}table.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 0;white-space:normal;text-align:right}table.rt td::before{content:attr(data-l);color:var(--mu);font-size:13px;text-align:left;flex:none}table.rt td[colspan]::before{display:none}.sum{gap:12px}.stats{grid-template-columns:1fr 1fr}#md>div{padding:16px}}
</style></head><body><header id="tb"><button onclick="$('.app').classList.toggle('open')" aria-label="Buka menu">☰</button><span>BengkelPOS</span></header>
<div class="app"><aside id="nav"></aside><div id="sc" onclick="$('.app').classList.remove('open')"></div><main id="v"></main></div><div id="md"><div id="mb"></div></div><div id="ts"></div><div id="pr"></div>
<script>
const R=n=>'Rp '+Math.round(n).toLocaleString('id-ID'),$=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const ST=['Menunggu Pengerjaan','Dalam Pengerjaan','Menunggu Spare Part','Pekerjaan Selesai','Menunggu Pengambilan','Diserahkan'];
const NEXT={0:[1],1:[2,3],2:[1],3:[4],4:[]};
const stc=i=>['t0','t1','t2','t3','t3','t0'][i];
let items=[{id:'J-001',name:'Servis berkala motor',cat:'Jasa Servis',type:'Jasa',price:75000,unit:'paket'},{id:'J-002',name:'Cek kelistrikan',cat:'Jasa Kelistrikan',type:'Jasa',price:50000,unit:'kali'},{id:'B-001',name:'Oli mesin 10W-40 1L',cat:'Oli',type:'Barang',price:65000,unit:'botol',stock:24,min:10},{id:'B-002',name:'Filter oli',cat:'Filter',type:'Barang',price:35000,unit:'pcs',stock:8,min:10},{id:'B-003',name:'Kampas rem depan',cat:'Spare Part Mesin',type:'Barang',price:120000,unit:'set',stock:5,min:3}];
let moves=[{d:'12 Okt 2026',item:'Oli mesin 10W-40 1L',t:'Penerimaan',q:24,ref:'Pembelian pemasok'}];
let cust=[{n:'Budi Santoso',tel:'0812-3456-7890',veh:['H 1234 AB · Honda Beat 2020','H 5521 XY · Yamaha NMAX 2022']},{n:'Siti Aminah',tel:'0821-9988-7766',veh:['H 7788 CD · Suzuki Ertiga 2018']},{n:'Agus Wijaya',tel:'0857-1122-3344',veh:['H 3301 EF · Toyota Avanza 2016']}];
let wos=[{no:'WO-2610-001',c:'Budi Santoso',v:'H 1234 AB · Honda Beat 2020',date:'17 Okt 2026 09:10',keluhan:'Mesin brebet, rem bunyi',cek:'Busi kotor, kampas tipis',mech:'Dedi',st:1,lines:[{ref:'J-001',name:'Servis berkala motor',type:'Jasa',price:75000,qty:1},{ref:'B-001',name:'Oli mesin 10W-40 1L',type:'Barang',price:65000,qty:1,issued:true}],paid:[]},
{no:'WO-2610-002',c:'Siti Aminah',v:'H 7788 CD · Suzuki Ertiga 2018',date:'18 Okt 2026 13:30',keluhan:'AC kurang dingin',cek:'',mech:'Rudi',st:2,lines:[{ref:'J-002',name:'Cek kelistrikan',type:'Jasa',price:50000,qty:1}],paid:[]},
{no:'WO-2610-003',c:'Agus Wijaya',v:'H 3301 EF · Toyota Avanza 2016',date:'16 Okt 2026 08:00',keluhan:'Ganti kampas rem',cek:'Piringan masih bagus',mech:'Dedi',st:4,lines:[{ref:'B-003',name:'Kampas rem depan',type:'Barang',price:120000,qty:1},{name:'Jasa pasang kampas rem',type:'Jasa',price:60000,qty:1,manual:true}],paid:[]}];
let notas=[];let view='dash',cur=null,draft=null,dirty=false,filt='',q='',role='';let users=[{u:'admin',p:'admin123',name:'Rina (Kasir)',r:'Admin / Kasir',on:true},{u:'mekanik',p:'mekanik123',name:'Dedi (Mekanik)',r:'Mekanik',on:true},{u:'pemilik',p:'pemilik123',name:'Pak Hendra',r:'Pemilik Bengkel',on:true}],user=null;
const NAVS={'Admin / Kasir':['dash','wo','items','stock','nota'],'Mekanik':['dash','wo'],'Pemilik Bengkel':['dash','wo','stock','nota','lap','users']};
const LBL={dash:'Dashboard',wo:'Work Order',users:'Pengguna',items:'Master Item',stock:'Persediaan',nota:'Nota & Pembayaran',lap:'Laporan'};
const tot=l=>l.reduce((s,x)=>s+x.price*x.qty,0);
const paid=w=>w.paid.reduce((s,p)=>s+p.amt,0);
const pst=w=>{if(!w.nota)return null;const p=paid(w),t=w.nota.total;return p>=t?['Lunas','t3']:p>0?['Dibayar Sebagian','t2']:['Belum Dibayar','t4']};
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#mb').innerHTML=h;$('#md').classList.add('on')}function close(){$('#md').classList.remove('on')}
$('#md').onclick=e=>{if(e.target.id=='md')close()};
function go(x,w){if(x!='wod'&&!NAVS[role].includes(x))return toast('Peran Anda tidak punya akses ke halaman ini');if(dirty&&!confirm('Ada perubahan yang belum disimpan. Tinggalkan halaman ini?'))return;dirty=false;view=x;cur=w||null;draft=w?clone(w.lines):null;render()}
function render(){document.body.classList.toggle('lo',!user);$('.app').classList.remove('open');const lo=!user;$('.app').style.gridTemplateColumns=lo?'1fr':'';$('#nav').style.display=lo?'none':'';if(lo){$('#v').innerHTML=loginV();return}
 $('#nav').innerHTML='<div class="logo">Bengkel<b>POS</b></div>'+NAVS[role].map(k=>`<button class="n ${view==k||(k=='wo'&&view=='wod')?'on':''}" onclick="go('${k}')">${LBL[k]}</button>`).join('')+`<label>Masuk: ${user.name}</label><div style="margin:0 10px 6px;font-size:13px;color:#b8c5ce">${role}</div><button class="n" onclick="logout()">Keluar</button>`;
 $('#v').innerHTML=({dash,wo:woList,wod,users:usersV,cats:catsV,items:itemsV,stock:stockV,nota:notaV,lap})[view]();fixT();window.scrollTo(0,0)}
function stats(){const a=wos.filter(w=>w.st<5);return[['Work Order aktif',a.length,'wo',''],['Sedang dikerjakan',wos.filter(w=>w.st==1).length,'wo','1'],['Menunggu pengambilan',wos.filter(w=>w.st==4).length,'wo','4'],['Belum lunas',notas.filter(n=>pst(wos.find(w=>w.nota==n))[0]!='Lunas').length,'nota','']]}
function dash(){const low=items.filter(i=>i.stock!=null&&i.stock<=i.min);
 return `<h1>Dashboard</h1><p class="sub">Ringkasan operasional bengkel hari ini</p><div class="stats">${stats().filter(s=>NAVS[role].includes(s[2])).map(s=>`<button class="stat" onclick="filt='${s[3]}';go('${s[2]}')"><b>${s[1]}</b><span>${s[0]}</span></button>`).join('')}</div>
 <div class="card"><h2>Pekerjaan berjalan</h2>${woTable(wos.filter(w=>w.st<5))}</div>
 ${low.length?`<div class="card"><h2>Peringatan persediaan</h2>${low.map(i=>`<div><span class="tag t2">Menipis</span> ${i.name} — sisa ${i.stock} ${i.unit} (minimum ${i.min})</div>`).join('')}</div>`:''}
 <div class="card"><h2>Penjualan nota terbit</h2><b style="font:700 28px 'Barlow Condensed'">${R(notas.reduce((s,n)=>s+n.total,0))}</b><p class="sub">Nilai pekerjaan yang masih berjalan dan belum ditagihkan: ${R(wos.filter(w=>!w.nota).reduce((s,w)=>s+tot(w.lines),0))}</p></div>`}
function woTable(a){if(!a.length)return '<p class="sub">Belum ada Work Order. Klik Buat WO untuk memulai.</p>';
 return `<div class="tw"><table><tr><th>No. WO</th><th>Pelanggan</th><th>Kendaraan</th><th>Status</th><th class="r">Total berjalan</th></tr>${a.map(w=>`<tr class="k" onclick="go('wod',wos.find(x=>x.no=='${w.no}'))"><td><b>${w.no}</b></td><td>${w.c}</td><td>${w.v}</td><td><span class="tag ${stc(w.st)}">${ST[w.st]}</span></td><td class="r">${R(tot(w.lines))}</td></tr>`).join('')}</table></div>`}
function woList(){const a=wos.filter(w=>(filt===''||w.st==filt)&&(!q||(w.no+w.c+w.v).toLowerCase().includes(q.toLowerCase())));
 return `<h1>Work Order</h1><p class="sub">Semua pekerjaan kendaraan, dari masuk sampai diserahkan</p><div class="bar"><input placeholder="Cari no. WO, pelanggan, atau nomor polisi" value="${q}" style="min-width:280px" onchange="q=this.value;render()"><select onchange="filt=this.value;render()"><option value="">Semua status</option>${ST.map((s,i)=>`<option value="${i}" ${filt==i&&filt!==''?'selected':''}>${s}</option>`).join('')}</select><span class="sp"></span>${role=='Admin / Kasir'?'<button class="btn p" onclick="newWO()">Buat WO</button>':''}</div><div class="card">${woTable(a)}</div>`}
function newWO(){modal(`<h2>Buat Work Order</h2><div class="f"><label>Pelanggan</label><select id="nc" onchange="document.getElementById('nv').innerHTML=cust.find(c=>c.n==this.value).veh.map(v=>'<option>'+v+'</option>').join('')">${cust.map(c=>`<option>${c.n}</option>`).join('')}</select></div><div class="f" style="margin-top:10px"><label>Kendaraan</label><select id="nv">${cust[0].veh.map(v=>`<option>${v}</option>`).join('')}</select></div><div class="f" style="margin-top:10px"><label>Keluhan pelanggan</label><textarea id="nk" rows="3"></textarea></div><div class="bar" style="margin:16px 0 0"><span class="sp"></span><button class="btn" onclick="close()">Batal</button><button class="btn p" onclick="mkWO()">Buat WO</button></div>`)}
function mkWO(){const n='WO-2610-'+String(wos.length+1).padStart(3,'0');const w={no:n,c:$('#nc').value,v:$('#nv').value,date:'19 Okt 2026 '+new Date().toTimeString().slice(0,5),keluhan:$('#nk').value||'-',cek:'',mech:'',st:0,lines:[],paid:[]};wos.unshift(w);close();toast('Dibuat '+n+'. Nota belum diterbitkan.');go('wod',w)}
function wod(){const w=cur,ro=w.st>=5,mk=role!='Admin / Kasir',next=NEXT[w.st]||[];
 return `<div class="bar"><button class="btn s" onclick="go('wo')">Kembali ke daftar</button><span class="sp"></span><span id="ds" class="${dirty?'dirty':'saved'}">${dirty?'Ada perubahan belum disimpan':'Semua perubahan tersimpan'}</span></div>
 <h1>${w.no}</h1><p class="sub">${w.c} · ${w.v} · Masuk ${w.date}</p>
 <div class="flow">${ST.map((s,i)=>`<span class="${i==w.st?'cur':''}">${s}</span>`).join('')}</div>
 <div class="card"><div class="grid2"><div class="f"><label>Keluhan pelanggan</label><div style="color:var(--tx)">${w.keluhan}</div></div><div class="f"><label>Mekanik</label><select ${ro||mk?'disabled':''} onchange="w_set('mech',this.value)">${['','Dedi','Rudi','Yanto'].map(m=>`<option ${m==w.mech?'selected':''} value="${m}">${m||'Belum ditugaskan'}</option>`).join('')}</select></div></div><div class="f" style="margin-top:10px"><label>Catatan pemeriksaan</label><textarea rows="2" ${ro?'disabled':''} onchange="w_set('cek',this.value)">${w.cek}</textarea></div>
 ${ro?'':`<div class="bar" style="margin:12px 0 0"><span style="color:var(--mu)">Ubah status:</span>${next.length?next.map(n=>`<button class="btn s" onclick="setSt(${n})">${ST[n]}</button>`).join(''):'<span class="tag t0">Selesaikan lewat finalisasi nota</span>'}</div>`}</div>
 <div class="card"><h2>Jasa dan spare part</h2>${ro?'':`<div class="bar"><div class="pick"><input id="sr" style="width:100%" placeholder="Cari item di katalog…" oninput="srch(this.value)" autocomplete="off"><div class="dd" id="dd" style="display:none"></div></div><button class="btn" onclick="manual()">Item belum ada di katalog</button></div>`}
 <div class="tw"><table><tr><th>Item</th><th>Tipe</th><th class="r">Harga satuan</th><th class="r">Qty</th><th class="r">Subtotal</th><th></th></tr>${draft.length?draft.map((l,i)=>`<tr><td>${l.name}${l.manual?'<span class="man">manual</span>':''}${l.note?`<div style="font-size:12px;color:var(--mu)">${l.note}</div>`:''}</td><td>${l.type}</td><td class="r">${ro||mk?R(l.price):`<input type="number" min="0" value="${l.price}" style="width:110px;text-align:right" onchange="ed(${i},'price',this.value)">`}</td><td class="r">${ro?l.qty:`<input type="number" min="1" value="${l.qty}" style="width:64px;text-align:right" onchange="ed(${i},'qty',this.value)">`}</td><td class="r">${R(l.price*l.qty)}</td><td class="r">${ro?'':`${l.type=='Barang'&&l.ref&&!l.issued?`<button class="btn s" onclick="issue(${i})">Keluarkan stok</button> `:l.issued?'<span class="tag t3">Stok keluar</span> ':''}<button class="btn s" onclick="rm(${i})">Hapus</button>`}</td></tr>`).join(''):'<tr><td colspan="6" style="color:var(--mu)">Belum ada item. Cari di katalog atau tambahkan item manual.</td></tr>'}</table></div>
 <div class="sum"><span>Total berjalan</span><b>${R(tot(draft))}</b></div></div>
 ${ro?`<div class="card"><h2>Nota ${w.nota.no}</h2><p>Diterbitkan ${w.nota.date}. Status pembayaran: <span class="tag ${pst(w)[1]}">${pst(w)[0]}</span></p><button class="btn p" onclick="go('nota')">Buka nota dan pembayaran</button></div>`:`<div class="bar"><span class="sp"></span><button class="btn" onclick="save()">Simpan progres</button>${mk?'':`<button class="btn w" ${w.st==4?'':'disabled title="Tersedia saat status Menunggu Pengambilan"'} onclick="fin()">Finalisasi nota</button>`}</div><p class="sub" style="text-align:right">Menyimpan progres tidak menerbitkan nota. Nota baru dibuat saat finalisasi.</p>`}`}
function w_set(k,v){cur[k]=v;toast('Tersimpan')}
function mark(){dirty=true;const d=$('#ds');if(d){d.className='dirty';d.textContent='Ada perubahan belum disimpan'}}
function srch(v){const d=$('#dd'),r=items.filter(i=>v&&(i.name+i.cat).toLowerCase().includes(v.toLowerCase()));d.style.display=r.length?'block':'none';d.innerHTML=r.map(i=>`<div onclick="add('${i.id}')"><span>${i.name} <small style="color:var(--mu)">${i.type}</small></span><b>${R(i.price)}</b></div>`).join('')}
function add(id){const i=items.find(x=>x.id==id);draft.push({ref:i.id,name:i.name,type:i.type,price:i.price,qty:1});mark();render()}

function newWO(){modal(`<h2>Buat Work Order</h2><div class="f"><label>Nama pelanggan</label><input id="nc"></div><div class="grid2" style="margin-top:10px"><div class="f"><label>Kendaraan (merek, model, tahun)</label><input id="nv" placeholder="Honda Beat 2020"></div><div class="f"><label>Nomor polisi</label><input id="np" placeholder="H 1234 AB" style="text-transform:uppercase"></div></div><div class="f" style="margin-top:10px"><label>Keluhan pelanggan</label><textarea id="nk" rows="3"></textarea></div><div class="bar" style="margin:16px 0 0"><span class="sp"></span><button class="btn" onclick="close()">Batal</button><button class="btn p" onclick="mkWO()">Buat WO</button></div>`)}
function mkWO(){const c=$('#nc').value.trim(),v=$('#nv').value.trim(),p=$('#np').value.trim().toUpperCase();if(!c||!v||!p)return toast('Isi nama pelanggan, kendaraan, dan nomor polisi');const n='WO-2610-'+String(wos.length+1).padStart(3,'0');const w={no:n,c,v,plat:p,d:TODAY,t:hm(),keluhan:$('#nk').value||'-',cek:'',mech:'',st:0,lines:[],paid:[]};wos.unshift(w);close();toast('Dibuat '+n+'. Nota belum diterbitkan.');go('wod',w)}
function wod(){const w=cur,ro=w.st>=5,mk=role!='Admin / Kasir',ro2=ro||role=='Pemilik Bengkel',next=NEXT[w.st]||[];return `<div class="bar"><button class="btn s" onclick="go('wo')">Kembali ke daftar</button><span class="sp"></span><span id="ds" class="${dirty?'dirty':'saved'}">${dirty?'Ada perubahan belum disimpan':'Semua perubahan tersimpan'}</span></div><h1>${w.no}</h1><p class="sub">${w.c} · ${w.v} · ${w.plat} · Masuk ${fd(w.d)} ${w.t}</p><div class="flow">${ST.map((s,i)=>`<span class="${i==w.st?'cur':''}">${s}</span>`).join('')}</div><div class="card"><div class="grid2"><div class="f"><label>Keluhan pelanggan</label><div style="color:var(--tx)">${w.keluhan}</div></div><div class="f"><label>Mekanik</label><select ${ro||mk?'disabled':''} onchange="w_set('mech',this.value)">${['','Dedi','Rudi','Yanto'].map(m=>`<option ${m==w.mech?'selected':''} value="${m}">${m||'Belum ditugaskan'}</option>`).join('')}</select></div></div><div class="f" style="margin-top:10px"><label>Catatan pemeriksaan</label><textarea rows="2" ${ro2?'disabled':''} onchange="w_set('cek',this.value)">${w.cek}</textarea></div>${ro2?'':`<div class="bar" style="margin:12px 0 0"><span style="color:var(--mu)">Ubah status:</span>${next.length?next.map(n=>`<button class="btn s" onclick="setSt(${n})">${ST[n]}</button>`).join(''):'<span class="tag t0">Selesaikan lewat finalisasi nota</span>'}</div>`}</div><div class="card"><h2>Jasa dan spare part</h2>${ro2?'':`<div class="bar"><div class="pick"><input id="sr" style="width:100%" placeholder="Cari item di katalog…" oninput="srch(this.value)" autocomplete="off"><div class="dd" id="dd" style="display:none"></div></div><button class="btn" onclick="manual()">Item belum ada di katalog</button></div>`}<div class="tw"><table><tr><th>Item</th><th class="r">Harga satuan</th><th class="r">Qty</th><th class="r">Subtotal</th><th></th></tr>${draft.length?draft.map((l,i)=>{const it=l.ref&&items.find(x=>x.id==l.ref);return `<tr><td>${l.name}${l.manual?'<span class="man">manual</span>':''}${it?`<div style="font-size:12px;color:var(--mu)">${it.cat}</div>`:''}</td><td class="r">${ro2||mk?R(l.price):`<input type="number" min="0" value="${l.price}" style="width:110px;text-align:right" onchange="ed(${i},'price',this.value)">`}</td><td class="r">${ro2?l.qty:`<input type="number" min="1" value="${l.qty}" style="width:64px;text-align:right" onchange="ed(${i},'qty',this.value)">`}</td><td class="r">${R(l.price*l.qty)}</td><td class="r">${l.issued?'<span class="tag t3">Stok keluar</span> ':''}${ro2?'':`${it&&it.track&&!l.issued?`<button class="btn s" onclick="issue(${i})">Keluarkan stok</button> `:''}<button class="btn s" onclick="rm(${i})">Hapus</button>`}</td></tr>`}).join(''):'<tr><td colspan="5" style="color:var(--mu)">Belum ada item. Cari di katalog atau tambahkan item manual.</td></tr>'}</table></div><div class="sum"><span>Total berjalan</span><b>${R(tot(draft))}</b></div></div>${ro?`<div class="card"><h2>Nota ${w.nota.no}</h2><p>Diterbitkan ${fd(w.nota.d)} ${w.nota.t}. Status pembayaran: <span class="tag ${pst(w)[1]}">${pst(w)[0]}</span></p><div class="bar" style="margin:0">${NAVS[role].includes('nota')?'<button class="btn p" onclick="go(\'nota\')">Buka nota dan pembayaran</button>':''}${role=='Admin / Kasir'?`<button class="btn" onclick="prn('${w.no}')">Cetak nota</button>`:''}</div></div>`:ro2?'':`<div class="bar"><span class="sp"></span><button class="btn" onclick="save()">Simpan progres</button>${mk?'':`<button class="btn w" ${w.st==4?'':'disabled title="Tersedia saat status Menunggu Pengambilan"'} onclick="fin()">Finalisasi nota</button>`}</div><p class="sub" style="text-align:right">Menyimpan progres tidak menerbitkan nota. Nota baru dibuat saat finalisasi.</p>`}`}
function srch(v){const d=$('#dd'),r=items.filter(i=>v&&(i.name+i.cat).toLowerCase().includes(v.toLowerCase()));d.style.display=r.length?'block':'none';d.innerHTML=r.map(i=>`<div onclick="add('${i.id}')"><span>${i.name} <small style="color:var(--mu)">${i.cat}</small></span><b>${R(i.price)}</b></div>`).join('')}
function add(id){const i=items.find(x=>x.id==id);draft.push({ref:i.id,name:i.name,price:i.price,qty:1});mark();render()}
function issue(i){if(dirty)return toast('Simpan progres dulu sebelum mengeluarkan stok');const l=draft[i],it=items.find(x=>x.id==l.ref);if(!it||!it.track)return toast('Item ini tidak mengelola stok');if(it.stock<l.qty)return toast('Stok tidak cukup: sisa '+it.stock);it.stock-=l.qty;moves.unshift({d:TODAY,item:it.name,t:'Pengeluaran',q:-l.qty,ref:cur.no});l.issued=true;cur.lines=clone(draft);toast('Stok dikurangi '+l.qty);render()}
function manual(){modal(`<h2>Tambah item manual</h2><div class="grid2"><div class="f"><label>Nama item</label><input id="mn"></div><div class="f"><label>Kategori</label><select id="mc">${cats.filter(c=>c.on).map(c=>`<option>${c.n}</option>`).join('')}</select></div><div class="f"><label>Harga satuan (Rp)</label><input id="mp" type="number" min="0"></div><div class="f"><label>Kuantitas</label><input id="mq" type="number" min="1" value="1"></div></div><label class="rad"><input type="radio" name="ms" value="wo" checked> <span><b>Gunakan hanya pada WO ini</b><br>Tidak masuk katalog permanen.</span></label><label class="rad"><input type="radio" name="ms" value="cat"> <span><b>Simpan ke katalog</b><br>Bisa dipakai lagi di pekerjaan berikutnya.</span></label><div class="bar" style="margin:14px 0 0"><span class="sp"></span><button class="btn" onclick="close()">Batal</button><button class="btn p" onclick="mkManual()">Tambah ke WO</button></div>`)}
function mkManual(){const n=$('#mn').value.trim(),p=+$('#mp').value,q=+$('#mq').value;if(!n||!(p>0)||!(q>=1))return toast('Isi nama, harga, dan kuantitas dengan benar');const sv=document.querySelector('[name=ms]:checked').value=='cat';let ref;if(sv){ref='M-'+String(items.length+1).padStart(3,'0');items.push({id:ref,name:n,cat:$('#mc').value,price:p,track:false})}draft.push({ref,name:n,price:p,qty:q,manual:!sv});close();mark();render()}
function fin(){if(dirty)return toast('Simpan progres dulu sebelum finalisasi');const w=cur;modal(`<h2>Finalisasi nota ${w.no}</h2><p>${w.c} · ${w.v} (${w.plat})</p><div class="tw"><table>${w.lines.map(l=>`<tr><td>${l.name}</td><td class="r">${l.qty} × ${R(l.price)}</td><td class="r">${R(l.price*l.qty)}</td></tr>`).join('')}</table></div><div class="sum"><span>Total akhir</span><b>${R(tot(w.lines))}</b></div><p class="sub">Tanggal pengambilan: ${fd(TODAY)}. Setelah dikonfirmasi, nota tidak dapat diubah diam-diam; koreksi dicatat lewat prosedur khusus.</p><div class="bar"><span class="sp"></span><button class="btn" onclick="close()">Periksa lagi</button><button class="btn w" id="fb" onclick="doFin()">Konfirmasi dan terbitkan nota</button></div>`)}
function doFin(){const b=$('#fb');if(b.disabled)return;b.disabled=true;const w=cur;w.nota={no:'NT-2610-'+String(notas.length+1).padStart(3,'0'),d:TODAY,t:hm(),total:tot(w.lines)};w.st=5;w.pickup=TODAY;notas.unshift(w.nota);close();toast('Nota '+w.nota.no+' diterbitkan');render()}
function itemsV(){return `<h1>Master Item</h1><p class="sub">Daftar barang dan jasa. Nyalakan Kelola stok untuk item yang jumlahnya perlu dipantau.</p><div class="bar"><input placeholder="Cari item atau kategori" value="${iq}" style="min-width:240px;flex:1" onchange="iq=this.value;render()"><button class="btn p" onclick="itemForm()">Tambah item</button></div><div class="card"><div class="tw"><table><tr><th>ID</th><th>Nama item</th><th>Kategori</th><th class="r">Harga default</th><th>Kelola stok</th><th></th></tr>${items.filter(i=>!iq||(i.name+i.cat).toLowerCase().includes(iq.toLowerCase())).map(i=>`<tr><td>${i.id}</td><td>${i.name}</td><td>${i.cat}</td><td class="r">${R(i.price)}</td><td><input type="checkbox" class="sw" ${i.track?'checked':''} onchange="trk('${i.id}',this.checked)"></td><td class="r"><button class="btn s" onclick="itemForm('${i.id}')">Ubah</button></td></tr>`).join('')}</table></div></div>`}
function trk(id,v){const i=items.find(x=>x.id==id);i.track=v;if(v&&i.stock==null){i.stock=0;i.min=0}toast(v?'Stok '+i.name+' sekarang dipantau':'Stok '+i.name+' tidak lagi dipantau');render()}
function itemForm(id){const i=id?items.find(x=>x.id==id):{name:'',cat:'',price:'',track:false,stock:0,min:0};modal(`<h2>${id?'Ubah':'Tambah'} item</h2><div class="grid2"><div class="f"><label>Nama item</label><input id="fn" value="${i.name}"></div><div class="f"><label>Kategori</label><select id="fc">${cats.filter(c=>c.on||c.n==i.cat).map(c=>`<option ${c.n==i.cat?'selected':''}>${c.n}</option>`).join('')}</select></div><div class="f"><label>Harga default (Rp)</label><input id="fp" type="number" min="0" value="${i.price}"></div><div class="f"><label>Kelola stok</label><input type="checkbox" class="sw" id="ft" ${i.track?'checked':''} onchange="$('#fm').disabled=!this.checked;$('#fq').disabled=!this.checked||${!!id}"></div><div class="f"><label>Stok awal${id?' (ubah lewat Terima barang)':''}</label><input id="fq" type="number" min="0" value="${i.stock||0}" ${i.track&&!id?'':'disabled'}></div><div class="f"><label>Stok minimum</label><input id="fm" type="number" min="0" value="${i.min||0}" ${i.track?'':'disabled'}></div></div><div class="bar" style="margin:14px 0 0"><span class="sp"></span><button class="btn" onclick="close()">Batal</button><button class="btn p" onclick="saveItem('${id||''}')">Simpan item</button></div>`)}
function saveItem(id){const n=$('#fn').value.trim(),c=$('#fc').value,p=+$('#fp').value,t=$('#ft').checked;if(!n||!c||!(p>=0)||$('#fp').value==='')return toast('Isi nama, kategori, dan harga default');const m=+$('#fm').value||0;if(id){const i=items.find(x=>x.id==id);Object.assign(i,{name:n,cat:c,price:p,track:t});if(t){if(i.stock==null)i.stock=0;i.min=m}}else{const q=t?+$('#fq').value||0:0,i={id:'I-'+String(items.length+1).padStart(3,'0'),name:n,cat:c,price:p,track:t};if(t){i.stock=q;i.min=m;if(q>0)moves.unshift({d:TODAY,item:n,t:'Penerimaan',q,ref:'Stok awal'})}items.push(i)}close();toast('Item disimpan');render()}
function catsV(){return `<h1>Master Kategori</h1><p class="sub">Kategori dipakai untuk mengelompokkan item. Kategori nonaktif tidak muncul saat menambah item baru.</p><div class="bar"><span class="sp"></span><button class="btn p" onclick="catForm(-1)">Tambah kategori</button></div><div class="card"><div class="tw"><table><tr><th>Nama kategori</th><th>Deskripsi</th><th class="r">Jumlah item</th><th>Aktif</th><th></th></tr>${cats.map((c,i)=>`<tr><td><b>${c.n}</b></td><td>${c.d||'-'}</td><td class="r">${items.filter(x=>x.cat==c.n).length}</td><td><input type="checkbox" class="sw" ${c.on?'checked':''} onchange="cats[${i}].on=this.checked;toast(this.checked?'Kategori diaktifkan':'Kategori dinonaktifkan')"></td><td class="r"><button class="btn s" onclick="catForm(${i})">Ubah</button></td></tr>`).join('')}</table></div></div>`}
function catForm(i){const c=i<0?{n:'',d:''}:cats[i];modal(`<h2>${i<0?'Tambah':'Ubah'} kategori</h2><div class="f"><label>Nama kategori</label><input id="kn" value="${c.n}"></div><div class="f" style="margin-top:10px"><label>Deskripsi</label><input id="kd" value="${c.d}"></div><div class="bar" style="margin:14px 0 0"><span class="sp"></span><button class="btn" onclick="close()">Batal</button><button class="btn p" onclick="saveCat(${i})">Simpan kategori</button></div>`)}
function saveCat(i){const n=$('#kn').value.trim(),d=$('#kd').value.trim();if(!n)return toast('Nama kategori wajib diisi');if(cats.some((c,j)=>j!=i&&c.n.toLowerCase()==n.toLowerCase()))return toast('Nama kategori sudah ada');if(i<0)cats.push({n,d,on:true});else{items.forEach(x=>{if(x.cat==cats[i].n)x.cat=n});cats[i].n=n;cats[i].d=d}close();toast('Kategori disimpan');render()}
function stockV(){const T=items.filter(i=>i.track);return `<h1>Persediaan</h1><p class="sub">Stok hanya berkurang saat barang dikeluarkan, bukan saat item ditambahkan ke WO. Item yang dipantau diatur di Master Item.</p><div class="card"><h2>Saldo stok</h2>${T.length?`<div class="tw"><table><tr><th>Barang</th><th class="r">Saldo</th><th class="r">Minimum</th><th></th></tr>${T.map(i=>`<tr><td>${i.name}</td><td class="r"><b>${i.stock}</b></td><td class="r">${i.min}</td><td>${i.stock<=i.min?'<span class="tag t2">Menipis</span> ':''}${role=='Admin / Kasir'?`<button class="btn s" onclick="recv('${i.id}')">Terima barang</button>`:''}</td></tr>`).join('')}</table></div>`:'<p class="sub">Belum ada item yang dipantau stoknya. Nyalakan Kelola stok di Master Item.</p>'}</div><div class="card"><h2>Riwayat pergerakan</h2><div class="tw"><table><tr><th>Tanggal</th><th>Barang</th><th>Jenis</th><th class="r">Jumlah</th><th>Referensi</th></tr>${moves.map(m=>`<tr><td>${fd(m.d)}</td><td>${m.item}</td><td>${m.t}</td><td class="r">${m.q>0?'+':''}${m.q}</td><td>${m.ref}</td></tr>`).join('')}</table></div></div>`}
function recv(id){const i=items.find(x=>x.id==id);modal(`<h2>Terima barang: ${i.name}</h2><div class="f"><label>Jumlah diterima</label><input id="rq" type="number" min="1" value="10"></div><div class="bar" style="margin-top:14px"><span class="sp"></span><button class="btn" onclick="close()">Batal</button><button class="btn p" onclick="rcv('${id}')">Simpan penerimaan</button></div>`)}
function rcv(id){const n=+$('#rq').value,i=items.find(x=>x.id==id);if(!(n>0))return toast('Jumlah harus lebih dari 0');i.stock+=n;moves.unshift({d:TODAY,item:i.name,t:'Penerimaan',q:n,ref:'Pembelian pemasok'});close();toast('Stok bertambah');render()}
function notaV(){const L=wos.filter(w=>w.nota),k=role=='Admin / Kasir';return `<h1>Nota & Pembayaran</h1><p class="sub">Status pekerjaan, nota, dan pembayaran dikelola terpisah</p><div class="card">${L.length?`<div class="tw"><table><tr><th>No. nota</th><th>Tanggal</th><th>Pelanggan</th><th>No. Polisi</th><th class="r">Total</th><th class="r">Terbayar</th><th class="r">Sisa</th><th>Status</th><th></th></tr>${L.map(w=>{const p=pst(w),b=paid(w);return `<tr><td><b>${w.nota.no}</b></td><td>${fd(w.nota.d)}</td><td>${w.c}</td><td>${w.plat}</td><td class="r">${R(w.nota.total)}</td><td class="r">${R(b)}</td><td class="r">${R(w.nota.total-b)}</td><td><span class="tag ${p[1]}">${p[0]}</span></td><td class="r">${k?`${p[0]!='Lunas'?`<button class="btn s" onclick="pay('${w.no}')">Catat pembayaran</button> `:''}<button class="btn s" onclick="prn('${w.no}')">Cetak nota</button>`:''}</td></tr>`}).join('')}</table></div>`:'<p class="sub">Belum ada nota. Nota terbit saat WO difinalisasi ketika kendaraan diambil.</p>'}</div>`}
function pay(no){const w=wos.find(x=>x.no==no),s=w.nota.total-paid(w);modal(`<h2>Pembayaran ${w.nota.no}</h2><p>Sisa tagihan: <b>${R(s)}</b></p><div class="grid2"><div class="f"><label>Nominal (Rp)</label><input id="pa" type="number" value="${s}"></div><div class="f"><label>Metode</label><select id="pm"><option>Tunai</option><option>Transfer</option><option>QRIS</option></select></div></div><div class="bar" style="margin-top:14px"><span class="sp"></span><button class="btn" onclick="close()">Batal</button><button class="btn p" onclick="savePay('${no}')">Simpan pembayaran</button></div>`)}
function savePay(no){const w=wos.find(x=>x.no==no),s=w.nota.total-paid(w),a=+$('#pa').value;if(!(a>0&&a<=s))return toast('Nominal harus lebih dari 0 dan tidak melebihi sisa');w.paid.push({amt:a,m:$('#pm').value,d:TODAY});close();toast('Pembayaran dicatat');render()}
function notaHtml(w){const n=w.nota,b=paid(w),p=pst(w),r=(a,c)=>`<tr><td>${a}</td><td style="text-align:right">${c}</td></tr>`;return `<div style="max-width:560px;margin:auto;font-size:14px;color:#000;background:#fff;padding:14px;border-radius:6px"><div style="text-align:center"><h2 style="margin:0">BengkelPOS</h2><div>Nota Pembayaran</div></div><hr><table style="width:100%">${r('No. nota','<b>'+n.no+'</b>')}${r('No. WO',w.no)}${r('Tanggal terbit',fd(n.d)+' '+n.t)}${r('Tanggal pengambilan',fd(w.pickup||n.d))}${r('Pelanggan',w.c)}${r('Kendaraan',w.v)}${r('No. polisi',w.plat)}</table><hr><table style="width:100%">${w.lines.map(l=>`<tr><td>${l.name}<br><small>${l.qty} × ${R(l.price)}</small></td><td style="text-align:right">${R(l.qty*l.price)}</td></tr>`).join('')}</table><hr><table style="width:100%">${r('<b>Total</b>','<b>'+R(n.total)+'</b>')}${w.paid.map(x=>r('Bayar '+fd(x.d)+' ('+x.m+')',R(x.amt))).join('')}${r('Terbayar',R(b))}${r('Sisa tagihan',R(n.total-b))}${r('Status',p[0])}</table><p style="text-align:center;margin:14px 0 0">Terima kasih atas kepercayaan Anda.</p></div>`}
function prn(no){if(role!='Admin / Kasir')return toast('Hanya kasir yang dapat mencetak nota');modal(`${notaHtml(wos.find(x=>x.no==no))}<div class="bar" style="margin:14px 0 0"><span class="sp"></span><button class="btn" onclick="close()">Tutup</button><button class="btn p" onclick="doPrint('${no}')">Cetak</button></div>`)}
function doPrint(no){$('#pr').innerHTML=notaHtml(wos.find(x=>x.no==no));try{window.print()}catch(e){toast('Cetak diblokir browser. Buka halaman ini di tab baru lalu coba lagi.')}}
function lap(){const bad=lf.a>lf.b,inR=d=>!bad&&d>=lf.a&&d<=lf.b,W=wos.filter(w=>inR(w.d)),N=wos.filter(w=>w.nota&&inR(w.nota.d)),pr=wos.reduce((s,w)=>s+w.paid.filter(p=>inR(p.d)).reduce((a,p)=>a+p.amt,0),0),U={};moves.filter(m=>m.t=='Pengeluaran'&&inR(m.d)).forEach(m=>U[m.item]=(U[m.item]||0)-m.q);const tn=N.reduce((s,w)=>s+w.nota.total,0),tp=N.reduce((s,w)=>s+paid(w),0),us=Object.keys(U);return `<h1>Laporan</h1><p class="sub">Pilih tanggal awal dan akhir untuk melihat ringkasan periode.</p><div class="card bar" style="align-items:flex-end"><div class="f"><label>Tanggal awal</label><input type="date" value="${lf.a}" onchange="lf.a=this.value||lf.a;render()"></div><div class="f"><label>Tanggal akhir</label><input type="date" value="${lf.b}" onchange="lf.b=this.value||lf.b;render()"></div><span class="sp"></span><button class="btn s" onclick="lf={a:TODAY,b:TODAY};render()">Hari ini</button><button class="btn s" onclick="lf={a:'2026-10-01',b:'2026-10-31'};render()">Oktober 2026</button></div>${bad?'<p style="color:var(--er)">Tanggal awal tidak boleh setelah tanggal akhir.</p>':`<div class="stats">${[['Nota terbit',N.length],['Total transaksi',R(tn)],['Terbayar (nota periode)',R(tp)],['Sisa tagihan',R(tn-tp)],['Pembayaran masuk periode',R(pr)]].map(s=>`<div class="stat" style="cursor:default"><b style="font-size:24px">${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div><div class="grid2"><div class="card"><h2>WO masuk per status</h2>${ST.map((s,i)=>`<div class="bar" style="margin:4px 0"><span>${s}</span><span class="sp"></span><b>${W.filter(w=>w.st==i).length}</b></div>`).join('')}<div class="bar" style="margin:10px 0 0"><span>Berjalan, belum ditagihkan</span><span class="sp"></span><b>${R(W.filter(w=>!w.nota).reduce((s,w)=>s+tot(w.lines),0))}</b></div></div><div class="card"><h2>Penggunaan spare part</h2>${us.length?`<div class="tw"><table><tr><th>Barang</th><th class="r">Dikeluarkan</th></tr>${us.map(k=>`<tr><td>${k}</td><td class="r">${U[k]}</td></tr>`).join('')}</table></div>`:'<p class="sub">Tidak ada pengeluaran barang pada periode ini.</p>'}</div></div><div class="card"><h2>Riwayat nota</h2>${N.length?`<div class="tw"><table><tr><th>No. nota</th><th>Tanggal</th><th>Pelanggan</th><th>No. Polisi</th><th class="r">Total</th><th class="r">Terbayar</th><th>Status</th></tr>${N.map(w=>`<tr><td><b>${w.nota.no}</b></td><td>${fd(w.nota.d)}</td><td>${w.c}</td><td>${w.plat}</td><td class="r">${R(w.nota.total)}</td><td class="r">${R(paid(w))}</td><td><span class="tag ${pst(w)[1]}">${pst(w)[0]}</span></td></tr>`).join('')}</table></div>`:'<p class="sub">Tidak ada nota pada periode ini.</p>'}</div>`}`}
render();
</script></body></html>
