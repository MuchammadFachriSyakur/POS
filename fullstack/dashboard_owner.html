<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b64c9" />
    <title>Dashboard Owner · POS Toko Pancing</title>
    <style>
      :root {
        --paper: #f2f6fb;
        --card: #fff;
        --ink: #10253a;
        --mut: #5d7186;
        --line: #e1e9f1;
        --field: #c9d6e3;
        --pri: #0b64c9;
        --pri-d: #084f9f;
        --pri-t: #e6f0fb;
        --bad: #d92d20;
        --bad-t: #fdecea;
        --warn: #8a5700;
        --warn-t: #fff4d6;
        --ok: #0f8a5f;
        --ok-t: #e1f5ec;
        --sh: 0 1px 2px #10253a0f, 0 6px 18px #10253a0c;
        --bar: 56px;
        --nav: 64px;
        --r: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font:
          16px/1.45 Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          Roboto,
          sans-serif;
        background: var(--paper);
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body.lock {
        overflow: hidden;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        min-height: 44px;
        touch-action: manipulation;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        width: 100%;
        min-height: 48px;
        padding: 0 14px;
        background: #fff;
        border: 1px solid var(--field);
        border-radius: var(--r);
      }
      textarea {
        padding: 12px 14px;
        min-height: 130px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid #0b64c933;
        border-color: var(--pri);
      }
      input[type="search"] {
        -webkit-appearance: none;
        appearance: none;
      }
      input[type="search"]::-webkit-search-cancel-button {
        display: none;
      }
      input[type="checkbox"] {
        width: 22px;
        height: 22px;
        min-height: 0;
        accent-color: var(--pri);
        flex: none;
      }
      [hidden] {
        display: none !important;
      }
      .i {
        display: block;
        flex: none;
      }
      .muted {
        color: var(--mut);
      }

      /* tombol */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 20px;
        border: 1px solid var(--field);
        border-radius: var(--r);
        background: #fff;
        font-weight: 600;
      }
      .btn:active {
        background: #edf2f8;
      }
      .btn.pri {
        background: var(--pri);
        border-color: var(--pri);
        color: #fff;
        box-shadow: 0 2px 8px #0b64c940;
      }
      .btn.pri:active {
        background: var(--pri-d);
      }
      .btn.bad {
        background: var(--bad);
        border-color: var(--bad);
        color: #fff;
      }
      .btn.outbad {
        color: var(--bad);
        border-color: #f0c0bb;
        background: #fff;
      }
      .btn.line {
        border-color: #a9c8ee;
        color: var(--pri);
        background: var(--pri-t);
      }
      .btn.wa {
        background: #1fa855;
        border-color: #1fa855;
        color: #fff;
      }
      .btn.big {
        min-height: 56px;
        font-size: 17px;
        border-radius: 14px;
      }
      .btn.wide {
        width: 100%;
      }
      .btn.sm {
        min-height: 40px;
        padding: 0 14px;
        font-size: 14.5px;
        gap: 6px;
      }
      .btns {
        display: flex;
        gap: 10px;
      }
      .btns > * {
        flex: 1;
      }
      .link {
        color: var(--pri);
        font-weight: 600;
        padding: 0 8px;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tag {
        display: inline-block;
        font-size: 11.5px;
        font-weight: 600;
        border-radius: 6px;
        padding: 2px 7px;
        background: var(--pri-t);
        color: var(--pri);
        margin-left: 6px;
        vertical-align: middle;
        white-space: nowrap;
      }
      .tag.bad {
        background: var(--bad-t);
        color: var(--bad);
      }
      .tag.warn {
        background: var(--warn-t);
        color: var(--warn);
      }
      .tag.ok {
        background: var(--ok-t);
        color: var(--ok);
      }
      .lbl {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--mut);
        margin: 20px 2px 8px;
      }
      .empty {
        padding: 36px 16px;
        text-align: center;
        color: var(--mut);
      }
      .empty .i {
        margin: 0 auto 10px;
        opacity: 0.55;
      }

      /* panel & daftar */
      .panel {
        background: var(--card);
        border-radius: var(--r);
        box-shadow: var(--sh);
        padding: 16px;
        margin-bottom: 14px;
      }
      .ph {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .ph .i {
        color: var(--pri);
      }
      .list {
        background: var(--card);
        border-radius: var(--r);
        box-shadow: var(--sh);
        overflow: hidden;
      }
      .list > * + * {
        border-top: 1px solid var(--line);
      }
      .notice {
        background: var(--warn-t);
        color: #5b3b00;
        border-radius: var(--r);
        padding: 12px 14px;
        margin-bottom: 14px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 14.5px;
      }
      .notice > .i {
        color: var(--warn);
      }
      .notice > span {
        flex: 1 1 220px;
      }

      /* tile kategori */
      .ct {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--pri-t);
        color: var(--pri);
      }
      .ct.c1 {
        background: #e6f0fb;
        color: #0b64c9;
      }
      .ct.c2 {
        background: #e1f5ec;
        color: #0f8a5f;
      }
      .ct.c3 {
        background: #e9eef3;
        color: #475b6e;
      }
      .ct.c4 {
        background: #fff1cc;
        color: #8a5700;
      }
      .ct.c5 {
        background: #fde6dd;
        color: #b4441f;
      }
      .ct.c6 {
        background: #eee8fb;
        color: #5b3fb0;
      }

      /* login */
      .login {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #e8f1fb;
      }
      .lbox {
        width: 100%;
        max-width: 360px;
        text-align: center;
        background: #fff;
        border-radius: 22px;
        padding: 28px 22px 18px;
        box-shadow: 0 12px 40px #10253a1f;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--pri);
        color: #fff;
      }
      .lmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font-size: 21px;
        font-weight: 700;
      }
      .dots {
        display: flex;
        gap: 14px;
        justify-content: center;
        margin: 22px 0 4px;
        min-height: 16px;
      }
      .dots i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--pri);
        display: block;
      }
      .dots i.f {
        background: var(--pri);
      }
      .lerr {
        min-height: 22px;
        color: var(--bad);
        font-weight: 600;
        font-size: 14px;
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 8px 0 14px;
      }
      .keys button {
        min-height: 58px;
        font-size: 22px;
        font-weight: 600;
        background: #f2f6fb;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .keys button:active {
        background: var(--pri-t);
      }
      .keys .ok {
        background: var(--pri);
        color: #fff;
        font-size: 16px;
      }
      .keys .del {
        color: var(--mut);
      }
      .hint {
        font-size: 13px;
        color: var(--mut);
        text-align: left;
      }
      .hint summary {
        cursor: pointer;
        text-align: center;
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .hint p {
        margin: 6px 0;
        line-height: 1.7;
        background: var(--paper);
        border-radius: 10px;
        padding: 10px 12px;
      }

      /* kerangka */
      .shell {
        min-height: 100vh;
      }
      .side {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: flex;
        background: #fff;
        box-shadow:
          0 -1px 0 var(--line),
          0 -6px 20px #10253a0a;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .side .brand,
      .side .userbox {
        display: none;
      }
      .nav {
        display: flex;
        flex: 1;
      }
      .nav button {
        flex: 1;
        min-height: var(--nav);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 12px;
        color: var(--mut);
        font-weight: 500;
      }
      .ni {
        display: flex;
        padding: 4px 20px;
        border-radius: 16px;
        transition: background 0.15s;
      }
      .nav button.on {
        color: var(--pri);
        font-weight: 700;
      }
      .nav button.on .ni {
        background: var(--pri-t);
      }
      .content {
        min-width: 0;
      }
      .appbar {
        position: sticky;
        top: 0;
        z-index: 25;
        height: calc(var(--bar) + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) 16px 0;
        background: var(--pri);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .appbar h1 {
        flex: 1;
        font-size: 19px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        font-size: 14px;
        color: #dbe9fb;
      }
      .av {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #ffffff30;
        color: #fff;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .main {
        padding: 16px 16px calc(var(--nav) + 24px + env(safe-area-inset-bottom));
      }
      .ptitle {
        display: none;
      }

      /* kasir: jual */
      .searchwrap {
        position: sticky;
        top: calc(var(--bar) + env(safe-area-inset-top));
        z-index: 6;
        background: var(--pri);
        margin: -16px -16px 14px;
        padding: 2px 16px 16px;
        border-radius: 0 0 22px 22px;
      }
      .sbox {
        position: relative;
        display: flex;
        align-items: center;
      }
      .sbox .i {
        position: absolute;
        left: 15px;
        top: 0;
        bottom: 0;
        margin: auto 0;
        color: var(--mut);
        pointer-events: none;
      }
      .sbox input {
        min-height: 54px;
        padding-left: 46px;
        padding-right: 48px;
        font-size: 17px;
        border: 0;
        border-radius: 14px;
        box-shadow: 0 4px 14px #00000026;
      }
      .sbox input:focus {
        outline: 3px solid #ffffff66;
      }
      .qc {
        position: absolute;
        right: 0;
        top: 0;
        width: 50px;
        height: 54px;
        color: var(--mut);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 62px;
        padding: 10px 14px;
        text-align: left;
        background: #fff;
      }
      .row:active {
        background: var(--pri-t);
      }
      .row .rn {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .row .rn b {
        font-weight: 600;
        line-height: 1.3;
      }
      .row .rn small {
        color: var(--mut);
        font-size: 13px;
      }
      .row .rp {
        font-weight: 700;
        white-space: nowrap;
      }
      .row .qb {
        min-width: 30px;
        height: 26px;
        padding: 0 8px;
        border-radius: 13px;
        background: var(--pri);
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin: 0 -16px 14px;
        padding: 0 16px 4px;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .sg {
        flex: none;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 21px;
        background: #fff;
        box-shadow: inset 0 0 0 1px var(--line);
        font-weight: 600;
        font-size: 15px;
        white-space: nowrap;
        color: var(--mut);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sg.on {
        background: var(--pri);
        color: #fff;
        box-shadow: none;
      }
      .favs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .fav {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 8px;
        min-height: 84px;
        padding: 12px;
        text-align: left;
        background: #fff;
        border-radius: var(--r);
        box-shadow: var(--sh);
      }
      .fav:active {
        background: var(--pri-t);
      }
      .fav .ft {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .fav .ct {
        width: 34px;
        height: 34px;
        border-radius: 9px;
      }
      .fav b {
        font-size: 14.5px;
        font-weight: 600;
        line-height: 1.3;
      }
      .fav span.pr {
        font-weight: 700;
        color: var(--pri);
        font-size: 15px;
      }
      .cartbar {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(var(--nav) + 12px + env(safe-area-inset-bottom));
        z-index: 20;
        min-height: 62px;
        padding: 0 18px;
        border-radius: 16px;
        background: var(--pri);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        box-shadow: 0 8px 24px #0b64c966;
      }
      .cartbar:disabled {
        opacity: 1;
        background: #fff;
        color: var(--mut);
        box-shadow: var(--sh);
      }
      .cartbar .cl {
        flex: 1;
        display: flex;
        flex-direction: column;
        line-height: 1.3;
      }
      .cartbar .cl b {
        font-weight: 700;
      }
      .cartbar .cl small {
        font-size: 13px;
        opacity: 0.85;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 48vw;
      }
      .cartbar .ct2 {
        font-size: 20px;
        font-weight: 700;
      }
      .cartbar.pulse {
        animation: pl 0.25s;
      }
      @keyframes pl {
        50% {
          transform: scale(1.02);
        }
      }
      .jual {
        padding-bottom: 90px;
      }
      .cart {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: var(--paper);
        display: none;
        flex-direction: column;
      }
      .cart.open {
        display: flex;
      }
      .cart-h {
        display: flex;
        align-items: center;
        gap: 6px;
        height: var(--bar);
        padding: 0 8px 0 18px;
        background: #fff;
        box-shadow: 0 1px 0 var(--line);
        flex: none;
      }
      .cart-h b {
        flex: 1;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cart-h b .i {
        color: var(--pri);
      }
      .cart-h .cc {
        font-weight: 500;
        color: var(--mut);
        font-size: 15px;
      }
      .cart-lines {
        flex: 1;
        overflow: auto;
        background: #fff;
        min-height: 0;
        margin-top: 1px;
      }
      .cl-i {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      .cl-t {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .cl-t .ct {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }
      .cl-n {
        flex: 1;
        font-weight: 600;
        line-height: 1.35;
        padding-top: 4px;
      }
      .cl-x {
        width: 44px;
        height: 36px;
        min-height: 36px;
        margin: -4px -12px 0 0;
        color: var(--bad);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cl-r {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .price {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .price i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-style: normal;
        color: var(--mut);
        font-size: 13px;
      }
      .price input {
        min-height: 46px;
        padding-left: 34px;
        text-align: right;
      }
      .step {
        display: flex;
        align-items: stretch;
        border: 1px solid var(--field);
        border-radius: var(--r);
        overflow: hidden;
        flex: none;
      }
      .step button {
        width: 46px;
        min-height: 46px;
        color: var(--pri);
        background: var(--pri-t);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .step input {
        width: 48px;
        min-height: 46px;
        border: 0;
        border-radius: 0;
        text-align: center;
        font-weight: 700;
        padding: 0;
      }
      .sub {
        min-width: 86px;
        text-align: right;
        font-weight: 700;
        flex: none;
      }
      .cart-f {
        flex: none;
        background: #fff;
        box-shadow:
          0 -1px 0 var(--line),
          0 -8px 24px #10253a0d;
        padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
      }
      .pay {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }
      .paylbl {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
        color: var(--mut);
      }
      .paylbl b {
        color: var(--bad);
      }
      .paidw {
        position: relative;
        display: block;
      }
      .paidw .i {
        position: absolute;
        left: 14px;
        top: 0;
        bottom: 0;
        margin: auto 0;
        color: var(--mut);
        pointer-events: none;
      }
      .paidw input {
        min-height: 52px;
        padding-left: 46px;
        font-size: 20px;
        font-weight: 700;
      }
      .paidw input.bad {
        border-color: var(--bad);
      }
      .pay-r {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .pay-r button {
        min-height: 42px;
        border-radius: 10px;
        background: var(--pri-t);
        color: var(--pri);
        font-weight: 600;
        font-size: 14px;
        padding: 0 4px;
      }
      .pay-r button.pas {
        background: var(--ok-t);
        color: var(--ok);
      }
      .pay-r button:active {
        filter: brightness(0.94);
      }
      .pay-c {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        color: var(--mut);
      }
      .pay-c span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pay-c b {
        font-size: 18px;
        color: var(--ink);
      }
      .pay-c b.neg {
        color: var(--bad);
      }
      .pay-c b.pos {
        color: var(--ok);
      }
      .phint {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13.5px;
        color: var(--warn);

      function mulberry(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

      function buildTrx(d, kasirId, lines, iso) {
        if (!Array.isArray(lines) || !lines.length)

          yymmdd = date.slice(2, 4) + date.slice(5, 7) + date.slice(8, 10);
        const n =
          d.trx.filter((t) => t.tanggal_waktu.startsWith(date)).length + 1;
        let total = 0,
          tm = 0;
        const items = [];
        for (const l of lines) {
          const qty = parseInt(l.qty),
            harga = Number(l.harga);
          if (!(qty > 0)) throw new Error("Jumlah harus lebih dari 0");
          if (!(harga >= 0) || isNaN(harga))
            throw new Error("Harga tidak valid");
          const m = l.item_id
            ? d.items.find((i) => i.item_id === l.item_id)
            : null;
          if (l.item_id && !m) throw new Error("Barang tidak ditemukan");
          const nama = m ? m.nama : String(l.nama || "").trim();
          if (!nama) throw new Error("Nama barang kosong");
          const modal = m ? m.harga_modal : null; // snapshot modal saat transaksi
          items.push({
            item_id: m ? m.item_id : "",
            nama_item: nama,
            qty,
            harga_jual: harga,
            harga_modal: modal,
          });
          total += qty * harga;
          tm += qty * (modal || 0);
        }
        const t = {
          trx_id: `${yymmdd}-${String(n).padStart(3, "0")}`,
          tanggal_waktu: iso,
          kasir_id: kasirId,
          total,
          total_modal: tm,
          bayar: null,
          kembali: null,
          status: "OK",
          void_oleh: "",
          void_waktu: "",
          void_alasan: "",
          items,

        d.trx.push(t);

        const rnd = mulberry(20261025),
          today = new Date();
        for (let k = 21; k >= 0; k--) {
          const day = new Date(today);
          day.setDate(day.getDate() - k);
          const cnt = k === 0 ? 3 : 4 + Math.floor(rnd() * 6),
            times = [];
          for (let j = 0; j < cnt; j++)
            times.push(
              9 * 60 + Math.floor((j + rnd() * 0.8) * (k === 0 ? 60 : 75)),
            );
          times.sort((a, b) => a - b);
          times.forEach((mn) => {

        },
        users() {
          auth(["PEMILIK"]);
          return db.users.map((u) => ({
            user_id: u.user_id,
            nama: u.nama,
            username: u.username || "",
            role: u.role,
            aktif: u.aktif,
          }));
        },
        addKasir(nama, username, password) {
          auth(["PEMILIK"]);
          nama = String(nama || "").trim();
          username = String(username || "")
            .trim()
            .toLowerCase();
          password = String(password || "");
          if (!nama) throw new Error("Nama wajib diisi");
          if (!/^[a-zA-Z0-9._-]{3,16}$/.test(username))
            throw new Error(
              "Username 3–16 karakter: huruf, angka, titik, _ atau -",
            );
          if (
            db.users.some(
              (u) => String(u.username || "").toLowerCase() === username,
            )
          )
            throw new Error("Username sudah dipakai");
          if (password.length < 6)
            throw new Error("Password minimal 6 karakter");
          db.users.push({
            user_id:
              "U" + (db.users.length + 1 + Math.floor(Math.random() * 90)),
            nama,
            username,
            password_hash: hash(password),
            role: "KASIR",
            aktif: true,
          });
          persist();
          return true;
        },
        setUserAktif(id, v) {
          const me = auth(["PEMILIK"]),
            u = db.users.find((x) => x.user_id === id);
          if (!u) throw new Error("Pengguna tidak ada");
          if (u.user_id === me.user_id)
            throw new Error("Tidak bisa menonaktifkan akun sendiri");
          u.aktif = !!v;
          persist();
          return true;
        },
        setPassword(id, password) {
          auth(["PEMILIK"]);
          password = String(password || "");
          if (password.length < 6)
            throw new Error("Password minimal 6 karakter");
          const u = db.users.find((x) => x.user_id === id);
          if (!u) throw new Error("Pengguna tidak ada");
          u.password_hash = hash(password);
          persist();
          return true;

          });
          const t = buildTrx(db, "U2", lines, date + "T12:00:00");

      /* ---------- Kasir: Jual ---------- */
      function searchItems(q) {
        const t = q.toLowerCase().split(/\s+/).filter(Boolean);

          .filter((i) => {
            const h = (i.nama + " " + i.kategori).toLowerCase();
            return t.every((x) => h.includes(x));

          .sort((a, b) => a.nama.localeCompare(b.nama, "id", { numeric: true }))
          .slice(0, 40);

      const cartTotal = () => S.cart.reduce((s, l) => s + l.qty * l.harga, 0);

        return l ? l.qty : 0;

      // Rekomendasi uang: pembulatan ke atas ke pecahan umum, menyesuaikan total belanja
      function suggestPay(t) {
        if (!(t > 0)) return [];
        const s = new Set();
        [5000, 10000, 20000, 50000, 100000].forEach((d) => {
          const v = Math.ceil(t / d) * d;
          if (v > t) s.add(v);
        });
        return [...s].sort((a, b) => a - b).slice(0, 3);
      }

  <b class="sub">${rp(l.harga * l.qty)}</b></div></div>`;

      function updTot() {

          n = S.cart.reduce((s, l) => s + l.qty, 0),
          paid = num(S.paid);
        $("#total").textContent = rp(t);
        $("#ccount").textContent = n ? `· ${n} item` : "";
        $("#cbn").textContent = n ? `${n} item` : "Keranjang kosong";

          : "Cari atau pilih barang";
        $("#cbt").textContent = n ? rp(t) : "";
        $("#cartbar").disabled = !n;
        // tombol rekomendasi uang menyesuaikan total
        const sg = suggestPay(t);
        $("#payr").innerHTML = n
          ? `<button class="pas" data-p="${t}">Uang pas</button>` +
            sg
              .map((v) => `<button data-p="${v}">${fmtNum(v)}</button>`)
              .join("")
          : "";
        $("#payr").hidden = !n;
        const d = paid - t,

        c.className = !paid ? "" : d >= 0 ? "pos" : "neg";
        pin.classList.toggle("bad", !!n && !!paid && d < 0);
        if (!n) {
          h.className = "phint";

        } else if (!paid) {
          h.className = "phint";
          h.innerHTML =
            ic("info", 16) + "Isi uang diterima untuk menyimpan transaksi";
        } else if (d < 0) {
          h.className = "phint";
          h.innerHTML =
            ic("alert", 16) + "Uang diterima masih kurang " + rp(-d);
        } else {
          h.className = "phint ok";
          h.innerHTML =
            ic("check", 16) +

        $("#save").disabled = !n || !paid || d < 0;

      function renderCart() {

      function renderRes() {
        const el = $("#res"),

        $("#cx").onclick = closeModal;
        setTimeout(() => (nama ? $("#cp") : $("#cn")).focus(), 50);

/* ---------- Pemilik: Dashboard ---------- */
      function periodRange() {
        const t = new Date(),
          T = ymd(t);
        if (S.period === "today") return [T, T];
        if (S.period === "7") {
          const d = new Date(t);
          d.setDate(d.getDate() - 6);
          return [ymd(d), T];
        }
        if (S.period === "month") return [T.slice(0, 8) + "01", T];
        let a = S.from || T,
          b = S.to || T;
        if (a > b) [a, b] = [b, a];
        return [a, b];
      }
      function niceMax(v) {
        const p = 10 ** Math.floor(Math.log10(v)),
          f = v / p;
        return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 4 ? 4 : f <= 8 ? 8 : 10) * p;
      }
      const short = (v) =>
        v >= 1e6
          ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0).replace(".", ",") + "jt"
          : v >= 1e3
            ? Math.round(v / 1e3) + "rb"
            : String(v);
      function drawChart() {
        const el = $("#chart");
        if (!el || !S.chart) return;
        const data = S.chart,
          W = Math.max(280, el.clientWidth),
          H = Math.round(Math.min(280, Math.max(190, W * 0.42))),
          m = { l: 42, r: 4, t: 8, b: 26 },
          iw = W - m.l - m.r,
          ih = H - m.t - m.b;
        const max = niceMax(
            Math.max(1, ...data.map((d) => Math.max(d.omzet, d.untung))),
          ),
          n = data.length,
          band = iw / n,
          bw = Math.max(2, Math.min(20, band * 0.36));
        let g = "";
        for (let i = 0; i <= 4; i++) {
          const y = m.t + ih - (ih * i) / 4;
          g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="#e3ebf3"/><text x="${m.l - 6}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#5d7186">${short((max * i) / 4)}</text>`;
        }
        const step = Math.ceil(n / Math.max(1, Math.floor(iw / 52)));
        data.forEach((d, i) => {
          const cx = m.l + band * (i + 0.5),
            h1 = (ih * d.omzet) / max,
            h2 = (ih * Math.max(0, d.untung)) / max;
          g += `<rect x="${cx - bw - 1}" y="${m.t + ih - h1}" width="${bw}" height="${h1}" rx="1.5" fill="#2f6fd0"><title>${d.tgl}: omzet ${rp(d.omzet)}</title></rect><rect x="${cx + 1}" y="${m.t + ih - h2}" width="${bw}" height="${h2}" rx="1.5" fill="#12a37f"><title>${d.tgl}: untung ${rp(d.untung)}</title></rect>`;
          if (i % step === 0)
            g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="#5d7186">${d.tgl.slice(8)}/${d.tgl.slice(5, 7)}</text>`;
        });
        el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik omzet dan untung per hari">${g}</svg>`;
      }
      let rzT;
      window.addEventListener("resize", () => {
        clearTimeout(rzT);
        rzT = setTimeout(() => {
          if (S.view === "dash") drawChart();
          if (isDesk()) document.body.classList.remove("lock");

  <section class="panel"><h2 class="ph">${ic("chart", 20)}Tren ${from === to ? "7 hari terakhir" : "per hari"}</h2>

    <p class="muted" style="font-size:12.5px;margin-top:8px">Barang tanpa harga modal tidak ikut dihitung.</p></section>
  </div>`;
        drawChart();
        $("#per").onclick = (e) => {
          const b = e.target.closest("[data-p]");
          if (!b) return;
          S.period = b.dataset.p;
          if (S.period === "range" && !S.from) {
            S.from = from;

        const ch = () => {

            S.onlyMissing = true;
            S.bq = "";
            S.bcat = "";
            go("barang");
          };
      };

    <div class="dl">${t.items.map((l) => `<div class="d"><span class="n">${ic("tag", 16)}${esc(l.nama_item)}${l.item_id ? "" : '<span class="tag">Barang lain</span>'}</span><span>${l.qty} × ${rp(l.harga_jual)}</span><span class="${l.harga_modal == null ? "q" : "muted"}">${l.harga_modal == null ? "modal belum diisi" : "modal " + rp(l.harga_modal)}</span><span class="${l.harga_modal == null ? "muted" : "g"}">${l.harga_modal == null ? "—" : "untung " + rp(l.qty * (l.harga_jual - l.harga_modal))}</span></div>`).join("")}
    ${t.bayar != null && !v ? `<div class="d"><span class="muted">Uang diterima</span><span>${rp(t.bayar)}</span><span class="muted">Kembalian</span><span>${rp(t.kembali)}</span></div>` : ""}
    <div class="act">${t.status === "OK" ? `<span></span><button class="btn sm outbad" data-void="${t.trx_id}">${ic("trash", 16)}Hapus (VOID)</button>` : `<span class="muted">Dihapus oleh ${esc(t.void_oleh)} · ${esc(t.void_alasan || "tanpa alasan")}</span>`}</div></div></details>`;
      })
      .join("") ||
    `<div class="empty">${ic("rcpt", 36)}Tidak ada transaksi pada tanggal ini.</div>`
  }</div>
  <div style="margin-top:18px"><button class="btn sm" id="tst">${ic("plus", 16)}Tambah transaksi uji (13 item = Rp 211.500) ke tanggal ini</button></div>`;
        const setD = (v) => {
          S.trxDate = v || todayStr();
          VIEWS.trx();
        };
        $("#td").onchange = (e) => setD(e.target.value);
        $("#dp").onclick = () => {
          const x = new Date(d + "T00:00");
          x.setDate(x.getDate() - 1);
          setD(ymd(x));
        };
        $("#dn").onclick = () => {
          const x = new Date(d + "T00:00");
          x.setDate(x.getDate() + 1);
          setD(ymd(x));
        };
        $("#dtd").onclick = () => setD(todayStr());
        $("#tst").onclick = () => {
          const t = API.addTest(d);
          VIEWS.trx();
          toast(`Transaksi uji ${t.trx_id}: ${rp(t.total)}`, { ms: 3500 });
        };
        tb.onclick = (e) => {
          const b = e.target.closest("[data-void]");
          if (b) askVoid(list.find((t) => t.trx_id === b.dataset.void));
        };
      };

      /* ---------- Pemilik: Master Barang ---------- */
      function itemModal(it) {
        it = it || {
          nama: "",
          kategori: CATS[0],
          harga_jual: "",
          harga_modal: "",
          favorit: false,
          aktif: true,
        };
        openModal(`<h3>${ic(it.item_id ? "edit" : "plus", 24)}${it.item_id ? "Ubah" : "Tambah"} barang</h3><form class="form" id="if" style="margin-top:12px">
  <label>Nama barang<input id="fn" required value="${esc(it.nama)}" autocomplete="off"></label>
  <label>Kategori<select id="fk">${[...new Set([...CATS, it.kategori])].map((c) => `<option ${c === it.kategori ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
  <div class="two2"><label>Harga jual (Rp)<input id="fj" inputmode="numeric" required value="${it.harga_jual}"></label><label>Harga modal (Rp)<input id="fm" inputmode="numeric" required value="${it.harga_modal ?? ""}"></label></div>
  <label class="ck"><input type="checkbox" id="ff" ${it.favorit ? "checked" : ""}> Tampilkan di Favorit</label>
  ${it.item_id ? `<label class="ck"><input type="checkbox" id="fa" ${it.aktif ? "checked" : ""}> Barang aktif (dijual)</label>` : ""}
  <p class="muted" style="font-size:13px">Harga modal wajib diisi agar untung akurat. Mengubah modal tidak mengubah laporan transaksi lama.</p>
  <div class="btns"><button type="button" class="btn" id="fx">Batal</button><button class="btn pri">${ic("check", 18)}Simpan</button></div></form>`);
        $("#fx").onclick = closeModal;
        $("#if").onsubmit = (e) => {
          e.preventDefault();
          try {
            API.saveItem({
              item_id: it.item_id,
              nama: $("#fn").value,
              kategori: $("#fk").value,
              harga_jual: num($("#fj").value),
              harga_modal: $("#fm").value === "" ? "" : num($("#fm").value),
              favorit: $("#ff").checked,
              aktif: it.item_id ? $("#fa").checked : true,
            });
            closeModal();
            S.items = API.items();
            VIEWS.barang();
            toast("Barang tersimpan");
          } catch (er) {
            toast(er.message, { err: true, ms: 3000 });
          }
        };
      }
      function importModal() {
        openModal(`<h3>${ic("upload", 24)}Impor barang</h3><p class="sub2">Tempel data CSV, satu barang per baris:<br><b>nama,kategori,harga_jual,harga_modal</b></p>
  <div class="form"><textarea id="csv" placeholder="Pcg Daichi 91 no 12,Pancing (Pcg),4500,3200"></textarea><div class="btns"><button class="btn" id="ix">Batal</button><button class="btn pri" id="iy">${ic("upload", 18)}Impor</button></div></div>`);
        $("#ix").onclick = closeModal;
        $("#iy").onclick = () => {
          const rows = $("#csv")
            .value.split(/\n/)
            .map((l) => l.split(",").map((x) => x.trim()))
            .filter((r) => r.length >= 3 && Number(r[2]) > 0);
          const n = API.importItems(rows);
          closeModal();
          VIEWS.barang();
          toast(
            n
              ? `${n} barang diimpor`
              : "Tidak ada barang baru (cek format atau duplikat)",
            { err: !n },
          );
        };
      }
      VIEWS.barang = function () {
        const all = API.itemsAll(),
          custom = API.customItems(),
          miss = all.filter((i) => i.aktif && i.harga_modal == null).length;
        const t = S.bq.toLowerCase().split(/\s+/).filter(Boolean);
        const list = all
          .filter(
            (i) =>
              (!S.bcat || i.kategori === S.bcat) &&
              (!S.onlyMissing || i.harga_modal == null) &&
              t.every((x) =>
                (i.nama + " " + i.kategori).toLowerCase().includes(x),
              ),
          )
          .sort(
            (a, b) =>
              b.aktif - a.aktif ||
              a.nama.localeCompare(b.nama, "id", { numeric: true }),
          );
        $("#view").innerHTML = `<div class="lim">
  ${miss ? `<div class="notice">${ic("alert", 22)}<span><b>${miss} barang belum ada harga modal.</b> Lengkapi agar untung akurat.</span><button class="btn sm" id="flt">${S.onlyMissing ? "Tampilkan semua" : "Tampilkan yang kosong"}</button></div>` : ""}
  <div class="tools"><input class="s" id="bs" type="search" placeholder="Cari barang" value="${esc(S.bq)}" aria-label="Cari barang"><select id="bc" aria-label="Kategori"><option value="">Semua kategori</option>${CATS.map((c) => `<option ${c === S.bcat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select><button class="btn pri" id="ba">${ic("plus", 18)}Tambah</button><button class="btn" id="bi">${ic("upload", 18)}Impor CSV</button></div>
  <div class="list">${
    list
      .map(
        (
          i,
        ) => `<button class="brow ${i.aktif ? "" : "off"}" data-e="${i.item_id}"><span class="bn">${catTile(i.kategori)}<span class="bt"><b>${esc(i.nama)}${i.favorit ? `<span class="tag">${ic("star", 11)} Favorit</span>` : ""}${i.aktif ? "" : '<span class="tag bad">Nonaktif</span>'}</b><small>${esc(i.kategori)}</small></span></span>
    <span class="v"><small>Jual</small>${rp(i.harga_jual)}</span><span class="v ${i.harga_modal == null ? "miss" : ""}"><small>Modal</small>${i.harga_modal == null ? "Belum diisi" : rp(i.harga_modal)}</span><span class="v"><small>Margin</small>${i.harga_modal == null ? "—" : Math.round(((i.harga_jual - i.harga_modal) / i.harga_jual) * 100) + "%"}</span></button>`,
      )
      .join("") || `<div class="empty">${ic("box", 36)}Tidak ada barang.</div>`
  }</div>
  ${custom.length ? `<h2 class="lbl" style="margin-top:22px">${ic("tag", 16)}Barang lain yang sering muncul</h2><div class="list">${custom.map((c, i) => `<div class="urow"><span class="ct c6">${ic("tag", 20)}</span><div class="un"><b>${esc(c.nama)}</b><small>Terjual ${c.count}× · terakhir ${rp(c.harga)}</small></div><button class="btn sm line" data-c="${i}">${ic("plus", 16)}Jadikan barang resmi</button></div>`).join("")}</div>` : ""}</div>`;
        $("#bs").oninput = (e) => {
          S.bq = e.target.value;
          const p = e.target.selectionStart;
          VIEWS.barang();
          const n = $("#bs");
          n.focus();
          n.setSelectionRange(p, p);
        };
        $("#bc").onchange = (e) => {
          S.bcat = e.target.value;
          VIEWS.barang();
        };
        $("#ba").onclick = () => itemModal();
        $("#bi").onclick = importModal;
        const f = $("#flt");
        if (f)
          f.onclick = () => {
            S.onlyMissing = !S.onlyMissing;
            VIEWS.barang();
          };
        $("#view").onclick = (e) => {
          const b = e.target.closest("[data-e]"),
            c = e.target.closest("[data-c]");
          if (b) itemModal(all.find((i) => i.item_id === b.dataset.e));
          if (c) {
            const x = custom[+c.dataset.c];
            itemModal({
              nama: x.nama,
              kategori: CATS[5],
              harga_jual: x.harga,
              harga_modal: "",
              favorit: false,
              aktif: true,
            });
          }
        };
      };

      /* ---------- Pemilik: Akun ---------- */
      VIEWS.akun = function () {
        const us = API.users();
        $("#view").innerHTML = `<div class="lim"><div class="list">${us
          .map(
            (
              u,
            ) => `<div class="urow"><span class="ct ${u.role === "PEMILIK" ? "c4" : "c1"}">${ic(u.role === "PEMILIK" ? "star" : "user", 20)}</span><div class="un"><b>${esc(u.nama)}</b>${u.aktif ? "" : '<span class="tag bad">Nonaktif</span>'}<small>${u.role === "PEMILIK" ? "Pemilik" : "Kasir"} · @${esc(u.username)}</small></div>
    <button class="btn sm" data-password="${u.user_id}">${ic("key", 16)}Ubah password</button>${u.user_id === S.user.user_id ? "" : `<button class="btn sm ${u.aktif ? "outbad" : "line"}" data-act="${u.user_id}" data-v="${u.aktif ? 0 : 1}">${ic(u.aktif ? "ban" : "check", 16)}${u.aktif ? "Nonaktifkan" : "Aktifkan"}</button>`}</div>`,
          )
          .join("")}</div>
  <div style="margin-top:14px"><button class="btn pri" id="ak">${ic("plus", 18)}Tambah kasir</button></div>
  <section class="panel" style="margin-top:24px"><h2 class="ph">${ic("info", 20)}Data demo</h2><p class="muted" style="font-size:14.5px;margin-bottom:12px">Prototype ini menyimpan data di browser. Reset untuk kembali ke data awal.</p><button class="btn sm outbad" id="rs2">${ic("undo", 16)}Reset data demo</button></section></div>`;
        $("#ak").onclick = () => {
          openModal(
            `<h3>${ic("user", 24)}Tambah kasir</h3><form class="form" id="kf" style="margin-top:12px"><label>Nama<input id="kn" required autocomplete="off"></label><label>Username<input id="ku" minlength="3" maxlength="16" pattern="[a-zA-Z0-9._-]+" required autocomplete="off"></label><label>Password<input id="kp" type="password" minlength="6" required autocomplete="new-password"></label><div class="btns"><button type="button" class="btn" id="kx">Batal</button><button class="btn pri">${ic("check", 18)}Simpan</button></div></form>`,
          );
          $("#kx").onclick = closeModal;
          $("#kf").onsubmit = (e) => {
            e.preventDefault();
            try {
              API.addKasir($("#kn").value, $("#ku").value, $("#kp").value);
              closeModal();
              VIEWS.akun();
              toast("Kasir ditambahkan");
            } catch (er) {
              toast(er.message, { err: true });
            }
          };
        };
        $("#view").onclick = (e) => {
          const a = e.target.closest("[data-act]"),
            p = e.target.closest("[data-password]");
          if (a) {
            try {
              API.setUserAktif(a.dataset.act, a.dataset.v === "1");
              VIEWS.akun();
            } catch (er) {
              toast(er.message, { err: true });
            }
          }
          if (p) {
            openModal(
              `<h3>${ic("key", 24)}Ubah password</h3><form class="form" id="pf" style="margin-top:12px"><label>Password baru<input id="np" type="password" minlength="6" autocomplete="new-password" required></label><div class="btns"><button type="button" class="btn" id="px">Batal</button><button class="btn pri">${ic("check", 18)}Simpan</button></div></form>`,
            );
            $("#px").onclick = closeModal;
            $("#pf").onsubmit = (ev) => {
              ev.preventDefault();
              try {
                API.setPassword(p.dataset.password, $("#np").value);
                closeModal();
                toast("Password diperbarui");
              } catch (er) {
                toast(er.message, { err: true });
              }
            };
          }
        };
        $("#rs2").onclick = () =>
          confirmModal(
            "Reset data demo?",
            "Semua transaksi dan perubahan akan kembali ke data awal.",
            "Reset",
            () => {
              API.reset();
              location.reload();
            },
            true,
            "undo",
          );
      };

      /* ---------- Start ---------- */
      const toLogin = () => location.replace("index.html");
      function logout() {
        API.logout();
        S.cart = [];
        S.paid = "";
        toLogin();
      }
      (function init() {
        // serah-terima akun dari index.html (sekali pakai)
        try {
          const pending = sessionStorage.getItem(LOGIN_KEY);
          if (pending) {
            sessionStorage.removeItem(LOGIN_KEY);
            API.loginFromServer(JSON.parse(pending));
          }
        } catch (e) {}
        let me;
        try {
          me = API.me();
        } catch (e) {
          return toLogin();
        }
        if (me.role !== PAGE_ROLE) {
          // salah halaman: arahkan ke dashboard yang sesuai role
          if (ROLE_PAGE[me.role]) return location.replace(ROLE_PAGE[me.role]);
          API.logout();
          return toLogin();
        }
        S.user = me;
        S.items = API.items();
        go(NAV[PAGE_ROLE][0][0]);
      })();
      // cegah halaman dari cache back/forward tetap terbuka setelah logout
      window.addEventListener("pageshow", (e) => {
        if (e.persisted) location.reload();
      });
    </script>
  </body>
</html>
