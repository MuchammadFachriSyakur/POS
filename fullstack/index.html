<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b64c9" />
    <title>Login · POS Toko Pancing</title>
    <style>
      :root {
        --paper: #f2f6fb;
        --card: #fff;
        --ink: #10253a;
        --mut: #5d7186;
        --line: #e1e9f1;
        --field: #c9d6e3;
        --pri: #0b64c9;
        --pri-d: #084f9f;
        --pri-t: #e6f0fb;
        --bad: #d92d20;
        --bad-t: #fdecea;
        --warn: #8a5700;
        --warn-t: #fff4d6;
        --ok: #0f8a5f;
        --ok-t: #e1f5ec;
        --sh: 0 1px 2px #10253a0f, 0 6px 18px #10253a0c;
        --bar: 56px;
        --nav: 64px;
        --r: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font:
          16px/1.45 Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          Roboto,
          sans-serif;
        background: var(--paper);
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body.lock {
        overflow: hidden;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        min-height: 44px;
        touch-action: manipulation;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        width: 100%;
        min-height: 48px;
        padding: 0 14px;
        background: #fff;
        border: 1px solid var(--field);
        border-radius: var(--r);
      }
      textarea {
        padding: 12px 14px;
        min-height: 130px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid #0b64c933;
        border-color: var(--pri);
      }
      input[type="search"] {
        -webkit-appearance: none;
        appearance: none;
      }
      input[type="search"]::-webkit-search-cancel-button {
        display: none;
      }
      input[type="checkbox"] {
        width: 22px;
        height: 22px;
        min-height: 0;
        accent-color: var(--pri);
        flex: none;
      }
      [hidden] {
        display: none !important;
      }
      .i {
        display: block;
        flex: none;
      }
      .muted {
        color: var(--mut);
      }

      /* tombol */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 20px;
        border: 1px solid var(--field);
        border-radius: var(--r);
        background: #fff;
        font-weight: 600;
      }
      .btn:active {
        background: #edf2f8;
      }
      .btn.pri {
        background: var(--pri);
        border-color: var(--pri);
        color: #fff;
        box-shadow: 0 2px 8px #0b64c940;
      }
      .btn.pri:active {
        background: var(--pri-d);
      }
      .btn.bad {
        background: var(--bad);
        border-color: var(--bad);
        color: #fff;
      }
      .btn.outbad {
        color: var(--bad);
        border-color: #f0c0bb;
        background: #fff;
      }
      .btn.line {
        border-color: #a9c8ee;
        color: var(--pri);
        background: var(--pri-t);
      }
      .btn.wa {
        background: #1fa855;
        border-color: #1fa855;
        color: #fff;
      }
      .btn.big {
        min-height: 56px;
        font-size: 17px;
        border-radius: 14px;
      }
      .btn.wide {
        width: 100%;
      }
      .btn.sm {
        min-height: 40px;
        padding: 0 14px;
        font-size: 14.5px;
        gap: 6px;
      }
      .btns {
        display: flex;
        gap: 10px;
      }
      .btns > * {
        flex: 1;
      }
      .link {
        color: var(--pri);
        font-weight: 600;
        padding: 0 8px;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tag {
        display: inline-block;
        font-size: 11.5px;
        font-weight: 600;
        border-radius: 6px;
        padding: 2px 7px;
        background: var(--pri-t);
        color: var(--pri);
        margin-left: 6px;
        vertical-align: middle;
        white-space: nowrap;
      }
      .tag.bad {
        background: var(--bad-t);
        color: var(--bad);
      }
      .tag.warn {
        background: var(--warn-t);
        color: var(--warn);
      }
      .tag.ok {
        background: var(--ok-t);
        color: var(--ok);
      }
      .lbl {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--mut);
        margin: 20px 2px 8px;
      }
      .empty {
        padding: 36px 16px;
        text-align: center;
        color: var(--mut);
      }
      .empty .i {
        margin: 0 auto 10px;
        opacity: 0.55;
      }
      /* login */
      .login {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #e8f1fb;
      }
      .lbox {
        width: 100%;
        max-width: 360px;
        text-align: center;
        background: #fff;
        border-radius: 22px;
        padding: 28px 22px 18px;
        box-shadow: 0 12px 40px #10253a1f;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--pri);
        color: #fff;
      }
      .lmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font-size: 21px;
        font-weight: 700;
      }
      .dots {
        display: flex;
        gap: 14px;
        justify-content: center;
        margin: 22px 0 4px;
        min-height: 16px;
      }
      .dots i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--pri);
        display: block;
      }
      .dots i.f {
        background: var(--pri);
      }
      .lerr {
        min-height: 22px;
        color: var(--bad);
        font-weight: 600;
        font-size: 14px;
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 8px 0 14px;
      }
      .keys button {
        min-height: 58px;
        font-size: 22px;
        font-weight: 600;
        background: #f2f6fb;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .keys button:active {
        background: var(--pri-t);
      }
      .keys .ok {
        background: var(--pri);
        color: #fff;
        font-size: 16px;
      }
      .keys .del {
        color: var(--mut);
      }
      .hint {
        font-size: 13px;
        color: var(--mut);
        text-align: left;
      }
      .hint summary {
        cursor: pointer;
        text-align: center;
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .hint p {
        margin: 6px 0;
        line-height: 1.7;
        background: var(--paper);
        border-radius: 10px;
        padding: 10px 12px;
      }

      .form {
        display: grid;
        gap: 14px;
      }
      .form label {
        display: grid;
        gap: 6px;
        font-weight: 600;
        font-size: 14px;
      }
      .form label.ck {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
        font-size: 15px;
      }
      .form .two2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="login">
      <div class="lbox">
        <div class="lmark">
          <span class="logo">
            <svg
              class="i"
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12c3-5 9-6 13-2l5-3v10l-5-3c-4 4-10 3-13-2z" />
              <circle cx="8" cy="11" r=".7" />
            </svg>
          </span>
          Toko Pancing
        </div>
        <p class="muted" style="margin-top: 6px">
          Masuk menggunakan akun Google Sheets
        </p>
        <form
          class="form"
          id="loginForm"
          style="text-align: left; margin-top: 24px"
        >
          <label
            >Username<input
              id="loginUsername"
              name="username"
              type="text"
              maxlength="16"
              autocomplete="username"
              placeholder="Masukkan username"
              required
          /></label>
          <label
            >Password<input
              id="loginPassword"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Masukkan password"
              required
          /></label>
          <div class="lerr" id="lerr" role="alert" aria-live="polite"></div>
          <button type="submit" class="btn pri big wide" id="loginBtn"></button>
        </form>
        <p class="muted" style="font-size: 12px; margin-top: 16px">
          Akun dikelola melalui sheet <b>USER</b>. Pastikan aplikasi dibuka dari
          URL Web App Google Apps Script.
        </p>
      </div>
    </div>

    <script>
      /* =====================================================================
   POS Toko Pancing — LOGIN
   Akun diverifikasi oleh Code.gs (Google Apps Script).
   Setelah berhasil, diarahkan ke dashboard sesuai role:
     OWNER / PEMILIK -> dashboard_owner.html
     KASIR / CASIR   -> dashboard_casir.html
   ===================================================================== */
      const DB_KEY = "postoko_proto_v2",
        SESS_KEY = "postoko_sess_v1",
        LOGIN_KEY = "postoko_login_v1";
      const LOGIN_URL =
        "https://script.google.com/macros/s/AKfycbwSvYRqKqdmr_5tsufYq6tDcUboR3zjT_e3J1d-tCCoYJJr-OMVt0UNU4k6JOzrG7eQ/exec";
      const ROLE_PAGE = {
        OWNER: "dashboard_owner.html",
        CASIR: "dashboard_casir.html",
      };
      const $ = (s) => document.querySelector(s);
      const BTN_HTML =
        '<svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Masuk';

      function normRole(r) {
        const x = String(r || "")
          .trim()
          .toUpperCase();
        if (["OWNER"].includes(x)) return "OWNER";
        if (["CASIR"].includes(x)) return "CASIR";
        return null;
      }

      // Sudah ada sesi aktif? langsung ke dashboard-nya.
      (function resume() {
        try {
          const db = JSON.parse(localStorage.getItem(DB_KEY));
          const id = localStorage.getItem(SESS_KEY);
          const u =
            db && db.users && db.users.find((x) => x.user_id === id && x.aktif);
          if (u && ROLE_PAGE[u.role]) location.replace(ROLE_PAGE[u.role]);
        } catch (e) {}
      })();

      $("#loginBtn").innerHTML = BTN_HTML;
      $("#loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const username = $("#loginUsername").value.trim();
        const password = $("#loginPassword").value;
        const button = $("#loginBtn");
        const error = $("#lerr");
        error.textContent = "";

        if (!username || !password) {
          error.textContent = "Username dan password wajib diisi";
          return;
        }

        button.disabled = true;
        button.textContent = "Memeriksa akun...";

        try {
          const response = await fetch(LOGIN_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "login", username, password }),
          });
          if (!response.ok)
            throw new Error("Server mengembalikan HTTP " + response.status);

          const result = await response.json();
          console.log(result.user);
          if (!result.success)
            throw new Error(result.message || "Username atau password salah");

          const su = result.user || {};
          const role = normRole(su.role);
          console.log(su.role);
          if (!su.username || !role)
            throw new Error("Role akun tidak dikenali: " + (su.role || "-"));

          // serah-terima ke dashboard (hanya data akun, tanpa password)
          sessionStorage.setItem(
            LOGIN_KEY,
            JSON.stringify({
              username: su.username,
              nama: su.nama || su.name || su.username,
              role: su.role,
              user_id: su.user_id || su.id,
            }),
          );
          location.replace(ROLE_PAGE[role]);
          return;
        } catch (err) {
          console.error(err);
          error.textContent = err.message || "Gagal terhubung ke server.";
        }
        button.disabled = false;
        button.innerHTML = BTN_HTML;
      };
    </script>
  </body>
</html>
